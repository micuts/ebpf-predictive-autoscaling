apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: l7-observability-frontend
  namespace: demo
spec:
  endpointSelector:
    matchLabels:
      app: frontend
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {}
